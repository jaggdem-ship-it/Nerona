<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Diablo Survivors - Gothic Horde Survival</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Cinzel', 'Georgia', serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #gameCanvas {
            position: absolute;
            z-index: 1;
        }
        #fxCanvas {
            position: absolute;
            z-index: 2;
            pointer-events: none;
        }
        #uiCanvas {
            position: absolute;
            z-index: 3;
            pointer-events: none;
        }
        #loadingScreen {
            position: absolute; z-index: 100;
            width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: #c0392b;
            transition: opacity 0.8s ease;
        }
        #loadingScreen.hidden { opacity: 0; pointer-events: none; }
        .loading-title {
            font-size: 3rem; letter-spacing: 0.3em;
            text-shadow: 0 0 20px #c0392b, 0 0 40px #8e0000;
            margin-bottom: 2rem; animation: pulse 2s infinite;
        }
        .loading-bar-container {
            width: 400px; height: 12px;
            border: 2px solid #5c0000;
            background: #1a1a1a;
            position: relative;
        }
        .loading-bar {
            height: 100%; width: 0%;
            background: #c0392b;
            box-shadow: 0 0 10px #c0392b;
            transition: width 0.3s ease;
        }
        .loading-text { margin-top: 1rem; font-size: 0.9rem; color: #666; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        #startScreen {
            position: absolute; z-index: 90;
            width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.95);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            color: #d4af37;
        }
        #startScreen.visible { display: flex; }
        .start-title {
            font-size: 4rem; letter-spacing: 0.2em;
            text-shadow: 0 0 30px #8b0000, 0 0 60px #3a0000;
            margin-bottom: 1rem;
        }
        .start-subtitle {
            font-size: 1.2rem; color: #888;
            margin-bottom: 3rem; letter-spacing: 0.1em;
        }
        .class-select {
            display: flex; gap: 2rem; margin-bottom: 3rem;
        }
        .class-card {
            width: 180px; height: 240px;
            border: 2px solid #444;
            background: #111;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; flex-direction: column;
            align-items: center; padding: 1rem;
        }
        .class-card:hover {
            border-color: #c0392b;
            box-shadow: 0 0 20px rgba(192, 57, 43, 0.3);
            transform: translateY(-5px);
        }
        .class-card.selected {
            border-color: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }
        .class-icon {
            width: 120px; height: 120px;
            margin-bottom: 1rem;
            border-radius: 50%;
            border: 2px solid #333;
        }
        .class-name {
            font-size: 1rem; color: #ccc;
            letter-spacing: 0.1em;
        }
        .start-btn {
            padding: 1rem 3rem;
            font-size: 1.3rem;
            background: #5c0000;
            color: #d4af37;
            border: 2px solid #8b0000;
            cursor: pointer;
            letter-spacing: 0.2em;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .start-btn:hover {
            background: #8b0000;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        }
        #gameOverScreen {
            position: absolute; z-index: 95;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
        }
        #gameOverScreen.visible { display: flex; }
        .game-over-title {
            font-size: 5rem; color: #c0392b;
            text-shadow: 0 0 40px #8b0000;
            margin-bottom: 1rem;
        }
        .game-over-stats {
            color: #aaa; font-size: 1.2rem;
            margin-bottom: 2rem; text-align: center;
            line-height: 2;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <canvas id="fxCanvas"></canvas>
        <canvas id="uiCanvas"></canvas>

        <div id="loadingScreen">
            <div class="loading-title">DIABLO SURVIVORS</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <div class="loading-text" id="loadingText">Summoning assets from the abyss...</div>
        </div>

        <div id="startScreen">
            <div class="start-title">DIABLO SURVIVORS</div>
            <div class="start-subtitle">Survive the endless horde. Embrace the darkness.</div>
            <div class="class-select" id="classSelect">
                <div class="class-card selected" data-class="heretic">
                    <img class="class-icon" src="assets/a1426963-5087-4d1e-8a40-c0998754c160.jpeg" alt="Heretic" style="object-fit: cover; object-position: top left;">
                    <div class="class-name">THE HERETIC</div>
                </div>
                <div class="class-card" data-class="necromancer">
                    <img class="class-icon" src="assets/a1426963-5087-4d1e-8a40-c0998754c160.jpeg" alt="Necromancer" style="object-fit: cover; object-position: top right;">
                    <div class="class-name">THE NECROMANCER</div>
                </div>
                <div class="class-card" data-class="paladin">
                    <img class="class-icon" src="assets/a1426963-5087-4d1e-8a40-c0998754c160.jpeg" alt="Paladin" style="object-fit: cover; object-position: bottom left;">
                    <div class="class-name">THE PALADIN</div>
                </div>
                <div class="class-card" data-class="rogue">
                    <img class="class-icon" src="assets/a1426963-5087-4d1e-8a40-c0998754c160.jpeg" alt="Rogue" style="object-fit: cover; object-position: bottom right;">
                    <div class="class-name">THE ROGUE</div>
                </div>
            </div>
            <button class="start-btn" id="startBtn">ENTER THE CRYPT</button>
        </div>

        <div id="gameOverScreen">
            <div class="game-over-title" id="gameOverTitle">YOU DIED</div>
            <div class="game-over-stats" id="gameOverStats"></div>
            <button class="start-btn" id="restartBtn">RESURRECT</button>
        </div>
    </div>

    <script type="module" src="src/MainApp.js"></script>
</body>
</html>
